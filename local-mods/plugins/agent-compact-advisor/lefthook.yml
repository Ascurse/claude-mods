pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,json,md,yml,yaml}"
      run: npx prettier --check {staged_files}
    # The whole-repo lint: it runs the model in its own ESLint process (see
    # CONTRIBUTING.md), which a single run over the staged files cannot.
    - name: lint
      glob: "*.{ts,tsx}"
      run: npm run -s lint
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: npm run -s typecheck
commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}
pre-push:
  jobs:
    - name: check
      run: unset GIT_DIR GIT_INDEX_FILE && npm run -s check
